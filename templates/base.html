<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mirageland{% endblock %}</title>
    <style>
        :root {
            --panel: rgba(21, 26, 40, 0.84);
            --text: #f5efe5;
            --muted: #cdbfae;
            --accent: #f0a36b;
            --accent-strong: #ffd284;
            --success: #9ad2a7;
            --line: rgba(255, 255, 255, 0.1);
            --shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Trebuchet MS", "Segoe UI Variable Text", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(240, 163, 107, 0.18), transparent 26%),
                radial-gradient(circle at top right, rgba(134, 185, 205, 0.12), transparent 24%),
                linear-gradient(180deg, #201726 0%, #16131c 30%, #121723 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.08));
        }

        a { color: inherit; text-decoration: none; }

        h1, h2, h3, strong {
            font-family: "Palatino Linotype", Georgia, serif;
            letter-spacing: 0.02em;
        }

        h1, h2, h3, p, ul { margin-top: 0; }
        code { font-family: Consolas, monospace; color: var(--accent-strong); }

        .site-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 24px 48px;
        }

        .site-header {
            position: sticky;
            top: 12px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(18, 20, 31, 0.78);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }

        .site-brand { display: flex; flex-direction: column; gap: 4px; }
        .site-brand strong { font-size: 1.45rem; }
        .site-brand span { color: var(--muted); font-size: 0.95rem; }

        .site-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .site-nav a,
        button,
        .button-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            color: var(--text);
            cursor: pointer;
            font: inherit;
            transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
        }

        .site-nav a:hover,
        button:hover,
        .button-link:hover {
            transform: translateY(-1px);
            background: linear-gradient(180deg, rgba(240, 163, 107, 0.18), rgba(255, 255, 255, 0.03));
            border-color: rgba(240, 163, 107, 0.35);
        }

        .site-nav form { margin: 0; }
        button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgba(240, 163, 107, 0.45);
            box-shadow: 0 0 0 3px rgba(240, 163, 107, 0.12);
        }

        main { gap: 22px; }

        .panel {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 26px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.015)),
                linear-gradient(180deg, rgba(37, 49, 70, 0.92), rgba(19, 21, 31, 0.94));
            box-shadow: var(--shadow);
        }

        .panel::after {
            content: "";
            position: absolute;
            inset: auto 18px 0 auto;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240, 163, 107, 0.18), transparent 70%);
            pointer-events: none;
            transform: translate(25%, 25%);
        }

        .hero-panel {
            background:
                radial-gradient(circle at top left, rgba(240, 163, 107, 0.18), transparent 28%),
                radial-gradient(circle at right, rgba(134, 185, 205, 0.12), transparent 24%),
                linear-gradient(135deg, rgba(44, 38, 57, 0.96), rgba(20, 24, 35, 0.98));
        }

        .sub-panel {
            padding: 20px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.015));
        }

        .muted { color: var(--muted); }

        .eyebrow,
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
        }

        .pill.gold {
            color: #fff0c4;
            border-color: rgba(255, 210, 132, 0.35);
            background: rgba(255, 210, 132, 0.08);
        }

        .pill.success {
            color: #dcffe3;
            border-color: rgba(154, 210, 167, 0.35);
            background: rgba(154, 210, 167, 0.08);
        }

        .grid { display: grid; gap: 18px; }

        .card-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .metric-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }

        .metric-card {
            padding: 18px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.018));
        }

        .metric-card strong {
            display: block;
            font-size: 1.65rem;
            margin-bottom: 6px;
        }

        .split {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .stack-sm > * + * { margin-top: 10px; }
        .stack-md > * + * { margin-top: 16px; }

        .action-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .list-clean {
            padding-left: 18px;
            margin-bottom: 0;
        }

        .list-clean li + li { margin-top: 8px; }

        .quote-block {
            padding-left: 16px;
            border-left: 3px solid rgba(240, 163, 107, 0.5);
            color: #f8dcc3;
        }

        .meter {
            height: 12px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
        }

        .meter-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #f0a36b, #86b9cd);
        }

        .viewer-shell {
            min-height: 360px;
            position: relative;
            overflow: hidden;
            padding: 18px;
            background:
                radial-gradient(circle at top, rgba(240, 163, 107, 0.24), transparent 35%),
                linear-gradient(180deg, rgba(12, 16, 26, 0.9), rgba(27, 35, 52, 0.92));
        }

        .viewer-shell.large {
            min-height: 620px;
            padding: 22px;
        }

        .character-layout {
            display: grid;
            gap: 22px;
            align-items: start;
        }

        .character-sidebar {
            display: grid;
            gap: 22px;
        }

        .shelf-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .field { display: grid; gap: 8px; }
        .field span { color: var(--muted); font-size: 0.95rem; }

        .field ul,
        .errorlist {
            margin: 0;
            padding-left: 18px;
            color: #ffd0c7;
        }

        .helptext {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .helptext ul {
            margin: 8px 0 0;
            padding-left: 18px;
        }

        .form-alert {
            padding: 14px 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 208, 199, 0.22);
            background: rgba(167, 64, 39, 0.18);
            color: #ffe3dd;
        }

        .empty-state {
            padding: 18px;
            border-radius: 18px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            color: var(--muted);
            background: rgba(255, 255, 255, 0.02);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 14px rgba(154, 210, 167, 0.8);
        }

        @media (min-width: 900px) {
            .grid.two-col { grid-template-columns: 1.2fr 0.8fr; }
            .character-layout { grid-template-columns: 1.3fr 0.7fr; }
        }

        @media (max-width: 720px) {
            .site-shell { padding: 18px 16px 36px; }
            .site-header { position: static; border-radius: 20px; }
            .site-nav { width: 100%; justify-content: flex-start; }
            .split { flex-direction: column; }
            .shelf-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="site-brand" href="{% url 'core:home' %}">
                <strong>Mirageland</strong>
                <span>The shelf is the game.</span>
            </a>
            <nav class="site-nav">
                <a href="{% url 'core:home' %}">Home</a>
                {% if request.user.is_authenticated %}
                    <a href="{% url 'catalogue:index' %}">Catalogue</a>
                    <a href="{% url 'catalogue:character-detail' 'sora-kasumi' %}">Sora</a>
                    <a href="{% url 'collection:room-detail' %}">Display Room</a>
                    <a href="{% url 'quests:hub' %}">Quest Hub</a>
                    <a href="{% url 'accounts:account' %}">Account</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">Log in</a>
                    <a href="{% url 'accounts:signup' %}">Sign up</a>
                {% endif %}
            </nav>
        </header>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
